apiVersion: v1
kind: ConfigMap
metadata:
  name: logagg-config
data:
  LOG_LEVEL: info
  NATS_STREAM: LOGS
  NATS_SUBJECT: logs.raw
  NATS_DLQ_SUBJECT: logs.raw.dlq
  NATS_DURABLE: processor
  NATS_MAX_DELIVER: "5"
  NATS_DEDUPE_WINDOW: 2m
  NATS_REPLAY_MODE: live
  NATS_BACKPRESSURE_STRATEGY: reject
  NATS_QUEUE_LAG_HIGH_WATERMARK: "10000"
  NATS_BACKPRESSURE_DELAY: 250ms
  NOTIFICATION_POLL_INTERVAL: 5s
  NOTIFICATION_RETRY_BASE: 30s
  NOTIFICATION_RETRY_MAX: 30m
  NOTIFICATION_LEASE_DURATION: 2m
  NOTIFICATION_MAX_ATTEMPTS: "5"
  NOTIFICATION_BATCH_SIZE: "50"
