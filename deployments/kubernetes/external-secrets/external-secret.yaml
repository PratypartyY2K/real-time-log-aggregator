apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: logagg-secrets
  namespace: logagg
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: logagg-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DSN
      remoteRef:
        key: logagg/postgres-dsn
    - secretKey: NATS_URL
      remoteRef:
        key: logagg/nats-url
    - secretKey: CLICKHOUSE_DSN
      remoteRef:
        key: logagg/clickhouse-dsn
    - secretKey: CLICKHOUSE_SHARD_DSNS
      remoteRef:
        key: logagg/clickhouse-shard-dsns
