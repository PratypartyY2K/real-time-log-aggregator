services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logagg
      POSTGRES_USER: logagg
      POSTGRES_PASSWORD: logagg
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.6
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-shard1-data:/var/lib/clickhouse
      - ./clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/shard1-macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro

  clickhouse-shard2:
    image: clickhouse/clickhouse-server:25.6
    depends_on:
      clickhouse-keeper:
        condition: service_healthy
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse-shard2-data:/var/lib/clickhouse
      - ./clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/shard2-macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro

  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:25.6
    volumes:
      - clickhouse-keeper-data:/var/lib/clickhouse-keeper
      - ./clickhouse/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-keeper-client", "-q", "ruok"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  nats-data:
  postgres-data:
  clickhouse-shard1-data:
  clickhouse-shard2-data:
  clickhouse-keeper-data:
  grafana-data:
