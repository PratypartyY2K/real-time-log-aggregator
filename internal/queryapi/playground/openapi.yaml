openapi: 3.1.0
info:
  title: Logagg API
  version: 1.0.0
  description: Multi-tenant log ingestion and query API.
servers:
  - url: http://localhost:8080
    description: Ingest API
  - url: http://localhost:8081
    description: Query API
security:
  - ApiKey: []
paths:
  /v1/logs:
    post:
      summary: Ingest a batch of logs
      operationId: ingestLogs
      servers:
        - url: http://localhost:8080
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatch"
      responses:
        "202":
          description: Batch durably queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      summary: Query raw logs
      operationId: queryLogs
      servers:
        - url: http://localhost:8081
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - { name: service, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: stream, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Tenant-scoped query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
            application/x-ndjson:
              schema:
                type: string
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/analytics:
    get:
      summary: Run an aggregate query
      servers:
        - url: http://localhost:8081
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - { name: aggregation, in: query, required: true, schema: { type: string, enum: [count, rate, percentile] } }
        - { name: bucket, in: query, schema: { type: string, enum: [minute, hour, day] } }
        - { name: group_by, in: query, schema: { type: string } }
      responses:
        "200": { description: Aggregate results }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/query:
    post:
      summary: Query using the JSON DSL
      servers:
        - url: http://localhost:8081
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Raw or aggregate query results }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/incidents/summary:
    post:
      summary: Explain the most recent incident matching a natural-language question
      operationId: summarizeIncident
      servers:
        - url: http://localhost:8081
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentSummaryRequest" }
      responses:
        "200":
          description: Evidence-grounded incident summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentSummaryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: OpenAI request failed }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/alerts:
    post:
      summary: Create an alert rule
      servers:
        - url: http://localhost:8081
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleMutation" }
      responses:
        "201":
          description: Alert rule created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      summary: List alert rules
      servers:
        - url: http://localhost:8081
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Alert rules
          content:
            application/json:
              schema:
                type: object
                required: [rules, count]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRule" }
                  count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/alerts/{id}:
    get:
      summary: Get an alert rule
      servers:
        - url: http://localhost:8081
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Alert rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Alert rule not found }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      summary: Update an alert rule
      servers:
        - url: http://localhost:8081
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRulePatch" }
      responses:
        "200":
          description: Updated alert rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Alert rule not found }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      summary: Delete an alert rule
      servers:
        - url: http://localhost:8081
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Alert rule deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Alert rule not found }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/alerts/history:
    get:
      summary: List alert history
      servers:
        - url: http://localhost:8081
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - { name: rule_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [firing, resolved] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          description: Alert lifecycle history
          content:
            application/json:
              schema:
                type: object
                required: [alerts, count]
                properties:
                  alerts:
                    type: array
                    items: { $ref: "#/components/schemas/AlertHistoryItem" }
                  count: { type: integer }
                  next_offset: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/status:
    get:
      security: []
      summary: Get query API status
      responses:
        "200": { description: Service status }
  /health:
    get:
      security: []
      summary: Liveness probe
      responses:
        "200": { description: Service is alive }
  /ready:
    get:
      security: []
      summary: Dependency readiness probe
      responses:
        "200": { description: Dependencies are ready }
        "503": { description: One or more dependencies are unavailable }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Start:
      name: start
      in: query
      required: true
      schema: { type: string, format: date-time }
    End:
      name: end
      in: query
      required: true
      schema: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: API key is not authorized for the service or environment
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit or queue backpressure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: A required dependency is unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    IngestBatch:
      type: object
      required: [schema_version, service, env, source, logs]
      properties:
        schema_version: { type: string, const: logs.ingest.v1 }
        service: { type: string }
        env: { type: string }
        source: { type: string }
        logs:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/IngestLog" }
    IngestLog:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp: { type: string, format: date-time }
        level: { type: string }
        message: { type: string }
        fields: { type: object, additionalProperties: true }
    IngestResponse:
      type: object
      required: [request_id, accepted, status]
      properties:
        request_id: { type: string }
        accepted: { type: integer }
        status: { type: string, const: queued }
    QueryResponse:
      type: object
      required: [logs, count, partial]
      properties:
        logs:
          type: array
          items: { $ref: "#/components/schemas/LogRecord" }
        count: { type: integer }
        next_offset: { type: integer }
        partial: { type: boolean }
        unavailable_shards:
          type: array
          items: { type: string }
    IncidentSummaryRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1 }
    IncidentSummaryResponse:
      type: object
      required: [question, answer, logs]
      properties:
        question: { type: string }
        answer: { type: string }
        logs:
          type: array
          items: { $ref: "#/components/schemas/LogRecord" }
    AlertRule:
      allOf:
        - $ref: "#/components/schemas/AlertRuleMutation"
        - type: object
          required: [id, tenant_id, status]
          properties:
            id: { type: integer, format: int64 }
            tenant_id: { type: integer, format: uint64 }
            status: { type: string, enum: [active, disabled, deleted] }
    AlertRuleMutation:
      type: object
      required: [service, environment, name, rule_type, severity, threshold, window_seconds]
      properties:
        service: { type: string }
        environment: { type: string }
        log_level: { type: string }
        fingerprint: { type: string }
        name: { type: string }
        rule_type: { type: string, example: count_threshold }
        severity: { type: string, example: high }
        filter_json: { type: object, additionalProperties: true, default: {} }
        group_by:
          type: array
          items: { type: string }
          default: []
        window_seconds: { type: integer, minimum: 1, example: 300 }
        threshold: { type: string, example: "20" }
        cooldown_seconds: { type: integer, minimum: 0, default: 600 }
        status: { type: string, enum: [active, disabled], default: active }
    AlertRulePatch:
      type: object
      properties:
        service: { type: string }
        environment: { type: string }
        log_level: { type: string }
        fingerprint: { type: string }
        name: { type: string }
        rule_type: { type: string }
        severity: { type: string }
        filter_json: { type: object, additionalProperties: true }
        group_by:
          type: array
          items: { type: string }
        window_seconds: { type: integer, minimum: 1 }
        threshold: { type: string }
        cooldown_seconds: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, disabled] }
    AlertHistoryItem:
      type: object
      properties:
        alert_instance_id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        rule_name: { type: string }
        severity: { type: string }
        dedupe_key: { type: string }
        status: { type: string, enum: [firing, resolved] }
        triggered_at: { type: string, format: date-time }
        first_fired_at: { type: string, format: date-time }
        last_fired_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        triggering_value: { type: number }
        notification_result:
          type: object
          properties:
            status: { type: string }
            attempt_count: { type: integer }
            last_error: { type: string }
            sent_at: { type: string, format: date-time }
    LogRecord:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        tenant_id: { type: integer, format: uint64 }
        service: { type: string }
        environment: { type: string }
        source: { type: string }
        host: { type: string }
        level: { type: string }
        trace_id: { type: string }
        fingerprint: { type: string }
        message: { type: string }
        fields: { type: object, additionalProperties: true }
        ingest_id: { type: string }
        raw_size_bytes: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
